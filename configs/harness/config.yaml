# CLI profile; RAG/vector services are opt-in. Local SQLite memory is enabled by the CLI.
# Configure LLM_BASE_URL, LLM_MODEL, LLM_API_KEY in the environment or config.local.yaml.
llm:
  base_url: ""
  model: ""
  timeout: 45s
  concurrency: 1
  queue_limit: 32 # waiting requests; 0 rejects immediately when all slots are busy
  retry:
    max_attempts: 3
    base_delay: 250ms
practice:
  image: "lanagent/practice-go:1.26.11-v1"
  work_dir: ".runtime/practice"
rag:
  enabled: false
telemetry:
  enabled: false
context:
  window: 32768
  output_reserve: 4096
  tool_reserve: 2048
  summary_tokens: 512

# rules needs no extra model; hybrid uses routing.classifier or inherits llm.
routing:
  mode: rules
  timeout: 3s
